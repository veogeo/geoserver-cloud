name: Manual cn-vg build to GHCR

on:
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: manual-cn-vg-ghcr-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-and-push:
    if: github.ref == 'refs/heads/cn-vg'
    name: Build and push (${{ matrix.arch }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 360
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-latest
          - arch: arm64
            runner: ubuntu-24.04-arm
    steps:
      - name: Checkout cn-vg and submodules
        uses: actions/checkout@v7
        with:
          submodules: recursive

      - name: Set up Java 25
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '25'
          cache: maven

      - name: Set image names and tags
        id: image-meta
        shell: bash
        run: |
          owner="$(printf '%s' "$GITHUB_REPOSITORY_OWNER" | tr '[:upper:]' '[:lower:]')"
          echo "repository=ghcr.io/${owner}" >> "$GITHUB_OUTPUT"
          echo "tag=cn-vg-${GITHUB_SHA}" >> "$GITHUB_OUTPUT"

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Run the complete build and test suite
        run: make
        env:
          REPOSITORY: ${{ steps.image-meta.outputs.repository }}
          TAG: ${{ steps.image-meta.outputs.tag }}-${{ matrix.arch }}

      - name: Push all base, infrastructure, and GeoServer images
        shell: bash
        env:
          REPOSITORY: ${{ steps.image-meta.outputs.repository }}
          TAG: ${{ steps.image-meta.outputs.tag }}-${{ matrix.arch }}
        run: |
          docker compose -f docker-build/base-images.yml push
          docker compose -f docker-build/infrastructure.yml push
          docker compose -f docker-build/geoserver.yml push

  publish-multiarch-manifests:
    if: github.ref == 'refs/heads/cn-vg'
    name: Publish multi-architecture tags
    needs: build-and-push
    runs-on: ubuntu-latest
    steps:
      - name: Set image names and tags
        id: image-meta
        shell: bash
        run: |
          owner="$(printf '%s' "$GITHUB_REPOSITORY_OWNER" | tr '[:upper:]' '[:lower:]')"
          echo "repository=ghcr.io/${owner}" >> "$GITHUB_OUTPUT"
          echo "tag=cn-vg-${GITHUB_SHA}" >> "$GITHUB_OUTPUT"

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Create amd64/arm64 manifests
        shell: bash
        env:
          REPOSITORY: ${{ steps.image-meta.outputs.repository }}
          TAG: ${{ steps.image-meta.outputs.tag }}
        run: |
          set -euo pipefail
          images=(
            gs-cloud-base-jre
            gs-cloud-base-spring-boot
            gs-cloud-base-geoserver-image
            geoserver-cloud-config
            geoserver-cloud-gateway
            geoserver-cloud-wfs
            geoserver-cloud-wms
            geoserver-cloud-wcs
            geoserver-cloud-wps
            geoserver-cloud-gwc
            geoserver-cloud-rest
            geoserver-cloud-webui
          )
          for image in "${images[@]}"; do
            docker buildx imagetools create \
              --tag "${REPOSITORY}/${image}:${TAG}" \
              "${REPOSITORY}/${image}:${TAG}-amd64" \
              "${REPOSITORY}/${image}:${TAG}-arm64"
          done
